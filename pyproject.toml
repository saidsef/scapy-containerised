[project]
name = "scapy-containerised"
version = "1.7.7"
description = "Containerised Scapy shell exposed via ttyd for interactive network analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Said Sef", email = "saidsef@gmail.com" }]
requires-python = ">=3.14"
keywords = ["scapy", "networking", "packet-analysis", "pcap", "kubernetes", "ttyd"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
  # cli is a subset of all; doc pulls sphinx and tox into the runtime image.
  "scapy[all]==2.7.0",
  "aiohttp>=3.14.3",
  "geoip2>=5.3.0",
  "libpcap>=1.11.0b7",
  "pyopenssl==26.4.0",
  "pyshark==0.6",
  # Version floors on transitive dependencies of matplotlib and pyx.
  "fonttools>=4.43.0",
  "numpy>=2.5.2",
  "pillow>=12.3.0",
  "pygments>=2.20.0",
  "zipp>=4.1.0",
]

[project.urls]
Homepage = "https://github.com/saidsef/scapy-containerised"
Repository = "https://github.com/saidsef/scapy-containerised"
Issues = "https://github.com/saidsef/scapy-containerised/issues"

[tool.uv]
package = false
