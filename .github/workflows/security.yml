name: Security

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security.yml"
  pull_request:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security.yml"
  # New advisories land against an unchanged lock, so scan on a timer too.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Audit uv.lock
        run: uv audit --preview-features audit-command

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject superseded Python manifests
        # A committed Pipfile.lock or requirements.txt is parsed into the
        # dependency graph and raises alerts against pins nothing installs.
        run: |
          found=$(git ls-files -- ':(glob)**/Pipfile' ':(glob)**/Pipfile.lock' ':(glob)**/requirements*.txt')
          if [ -n "$found" ]; then
            echo "::error::uv.lock is the only supported manifest, remove: $found"
            exit 1
          fi
